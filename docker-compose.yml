services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cashflowgo
      POSTGRES_USER: cashflowgo
      POSTGRES_PASSWORD: cashflowgo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflowgo -d cashflowgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: local-docker-dev-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql://cashflowgo:cashflowgo@db:5432/cashflowgo
      DATABASE_SSL_REQUIRE: "false"
      EMAIL_NOTIFICATIONS_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm start"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      WATCHPACK_POLLING: "true"
      REACT_APP_API_BASE_URL: http://localhost:8000/api
      REACT_APP_ENABLE_OFFLINE_FALLBACK: "0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  frontend-node-modules:
